
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAY - Personal AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101510;color:#f4f5ed;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;flex-direction:column;
}
header{
 padding:20px;border-bottom:1px solid #29352b;
 display:flex;align-items:center;gap:12px;
}
.logo{
 background:#b4d6a5;color:#142014;
 padding:12px;border-radius:13px;font-weight:bold;
 font-size:22px;
}
header h2{margin:0;font-size:21px}
header small{color:#a1b19d}
main{
 flex:1;overflow:auto;padding:22px 16px;
 display:flex;flex-direction:column;gap:15px;
}
.welcome{text-align:center;margin:auto 0}
.welcome h1{font-size:43px;color:#b4d6a5;margin-bottom:8px}
.welcome p{color:#a4b09f;line-height:1.6}
.msg{
 padding:13px 15px;border-radius:15px;
 max-width:85%;line-height:1.5;white-space:pre-wrap;
}
.user{background:#304a32;align-self:flex-end}
.bot{background:#202a21;align-self:flex-start}
footer{padding:14px;border-top:1px solid #29352b}
.inputbox{
 display:flex;gap:8px;background:#202a21;
 border:1px solid #405342;border-radius:15px;padding:8px;
}
input{
 flex:1;min-width:0;background:transparent;
 border:0;outline:0;color:white;font-size:16px;padding:8px;
}
button{
 border:0;border-radius:11px;padding:12px;
 background:#b4d6a5;color:#142014;font-weight:bold;
}
button:active{opacity:.7}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.status{text-align:center;color:#9aa995;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<header>
 <div class="logo">M</div>
 <div>
  <h2>MAY</h2>
  <small>Your Personal AI Assistant</small>
 </div>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h1>MAY.</h1>
  <p>Your ideas. Your commands. Your AI.<br>
  What would you like me to do?</p>
 </div>
</main>

<footer>
 <div class="inputbox">
  <input id="message" placeholder="Talk to MAY..." />
  <button onclick="send()">➤</button>
 </div>
 <div class="actions">
  <button onclick="voice()">🎙 Voice</button>
  <button onclick="clearChat()">Clear chat</button>
 </div>
 <div class="status" id="status">MAY interface ready · AI connection pending</div>
</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");

function addMessage(text,type){
 document.getElementById("welcome")?.remove();
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

function send(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 addMessage(
 "I received your command. My AI brain is not connected yet. Once we connect it, I will be able to understand and execute your tasks.",
 "bot"
 );
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});

function voice(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){
  alert("Voice recognition is not supported in this browser. Try Chrome.");
  return;
 }
 const rec=new Speech();
 rec.lang="en-IN";
 rec.onresult=e=>{
  input.value=e.results[0][0].transcript;
  send();
 };
 rec.onerror=()=>alert("Microphone permission or voice recognition issue.");
 rec.start();
}

function clearChat(){
 chat.innerHTML="";
 const welcome=document.createElement("div");
 welcome.className="welcome";
 welcome.id="welcome";
 welcome.innerHTML="<h1>MAY.</h1><p>Your ideas. Your commands. Your AI.<br>What would you like me to do?</p>";
 chat.appendChild(welcome);
}

</script>
</body>
</html>
